name: Deploy help pictures, help zip and redirects to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pages is set up on MatterHackers/MatterCAD_Docs only; on a fork (larsbrubaker/MatterCAD_Docs)
    # configure-pages fails with "Get Pages site failed", so a fork push skips the deploy.
    if: github.repository == 'MatterHackers/MatterCAD_Docs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the site build
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # The help is read at mattercad.com/help; this site keeps the pictures and help-docs.zip that
      # MatterCAD downloads, and sends every old article address to the same article there.
      - name: Build the site
        run: python3 scripts/build_site.py --out _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
